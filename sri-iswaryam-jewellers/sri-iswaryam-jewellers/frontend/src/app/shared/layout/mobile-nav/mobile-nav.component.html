<!-- Overlay -->
<div *ngIf="isOpen" 
     (click)="close()"
     class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 transition-opacity duration-300"
     [class.opacity-0]="!isOpen"
     [class.opacity-100]="isOpen">
</div>

<!-- Slide-over Nav -->
<div class="fixed inset-y-0 left-0 w-80 max-w-[85vw] bg-white shadow-2xl z-50 transform transition-transform duration-300 ease-out"
     [class.-translate-x-full]="!isOpen"
     [class.translate-x-0]="isOpen">
  
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b bg-gradient-to-r from-yellow-600 to-yellow-700">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center">
        <span class="text-yellow-600 font-bold text-lg">SI</span>
      </div>
      <div>
        <h2 class="text-white font-serif font-bold">Sri Iswaryam</h2>
        <p class="text-yellow-200 text-xs">Premium Jewellers</p>
      </div>
    </div>
    <button (click)="close()" 
            class="p-2 text-white hover:bg-white/20 rounded-full transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto">
    <!-- Main Links -->
    <div class="py-4">
      <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Shop</p>
      <a *ngFor="let link of navLinks"
         [routerLink]="link.path"
         routerLinkActive="bg-yellow-50 text-yellow-700 border-l-4 border-yellow-600"
         [routerLinkActiveOptions]="{ exact: link.path === '/' }"
         (click)="onLinkClick()"
         class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="link.icon"/>
        </svg>
        <span class="font-medium">{{ link.label }}</span>
      </a>
    </div>

    <!-- Divider -->
    <div class="border-t mx-4"></div>

    <!-- Account Links -->
    <div class="py-4">
      <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Account</p>
      <a *ngFor="let link of accountLinks"
         [routerLink]="link.path"
         routerLinkActive="bg-yellow-50 text-yellow-700"
         (click)="onLinkClick()"
         class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-gray-50 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="link.icon"/>
        </svg>
        <span class="font-medium">{{ link.label }}</span>
      </a>
    </div>
  </nav>

  <!-- Footer -->
  <div class="border-t p-4 bg-gray-50">
    <a href="tel:+919876543210" class="flex items-center gap-3 text-gray-600 hover:text-yellow-600 mb-3">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
      <span>+91 98765 43210</span>
    </a>
    <p class="text-xs text-gray-500">Mon - Sat: 10:00 AM - 8:00 PM</p>
  </div>
</div>
