<!-- Text skeleton -->
<ng-container *ngIf="type === 'text'">
  <div *ngFor="let item of items" 
       class="bg-gray-200 rounded"
       [class.animate-pulse]="animated"
       [style.width]="width"
       [style.height]="height"
       [class.mb-2]="count > 1">
  </div>
</ng-container>

<!-- Circle skeleton (avatar) -->
<ng-container *ngIf="type === 'circle'">
  <div class="bg-gray-200 rounded-full"
       [class.animate-pulse]="animated"
       [style.width]="width"
       [style.height]="width">
  </div>
</ng-container>

<!-- Rectangle skeleton (image) -->
<ng-container *ngIf="type === 'rectangle'">
  <div class="bg-gray-200 rounded-lg"
       [class.animate-pulse]="animated"
       [style.width]="width"
       [style.height]="height">
  </div>
</ng-container>

<!-- Card skeleton -->
<ng-container *ngIf="type === 'card'">
  <div *ngFor="let item of items" 
       class="bg-white rounded-lg shadow p-4 mb-4"
       [class.animate-pulse]="animated">
    <div class="bg-gray-200 rounded-lg h-40 mb-4"></div>
    <div class="bg-gray-200 rounded h-4 w-3/4 mb-2"></div>
    <div class="bg-gray-200 rounded h-4 w-1/2"></div>
  </div>
</ng-container>

<!-- Product card skeleton -->
<ng-container *ngIf="type === 'product'">
  <div *ngFor="let item of items" 
       class="bg-white rounded-lg shadow-md overflow-hidden"
       [class.animate-pulse]="animated">
    <!-- Image placeholder -->
    <div class="bg-gray-200 h-48 sm:h-56"></div>
    <!-- Content -->
    <div class="p-4">
      <!-- Title -->
      <div class="bg-gray-200 rounded h-4 w-3/4 mb-3"></div>
      <!-- Price -->
      <div class="bg-gray-200 rounded h-5 w-1/3 mb-3"></div>
      <!-- Rating -->
      <div class="flex gap-1 mb-3">
        <div class="bg-gray-200 rounded h-4 w-4" *ngFor="let s of [1,2,3,4,5]"></div>
      </div>
      <!-- Button -->
      <div class="bg-gray-200 rounded h-10 w-full"></div>
    </div>
  </div>
</ng-container>
