<div class="flex flex-col items-center justify-center py-12 px-4 text-center">
  <!-- Icon -->
  <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-6">
    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" [attr.d]="iconPath"/>
    </svg>
  </div>

  <!-- Title -->
  <h3 class="text-lg font-semibold text-gray-800 mb-2">{{ title }}</h3>

  <!-- Description -->
  <p *ngIf="description" class="text-gray-500 max-w-sm mb-6">{{ description }}</p>

  <!-- Action Button -->
  <a *ngIf="actionLink" 
     [routerLink]="actionLink"
     class="btn-primary inline-flex items-center gap-2">
    {{ actionLabel }}
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
    </svg>
  </a>
  
  <button *ngIf="!actionLink && actionLabel" 
          (click)="onAction()"
          class="btn-primary inline-flex items-center gap-2">
    {{ actionLabel }}
  </button>
</div>
