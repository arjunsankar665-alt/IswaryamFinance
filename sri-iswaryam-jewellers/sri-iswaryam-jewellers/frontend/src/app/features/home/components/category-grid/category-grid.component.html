<section class="py-16 bg-white">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-serif font-bold text-center mb-4">
      Shop by Category
    </h2>
    <p class="text-gray-600 text-center mb-12 max-w-2xl mx-auto">
      Explore our curated collections of fine jewellery
    </p>
    
    <!-- Category Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 md:gap-6">
      <a *ngFor="let category of categories" 
         [routerLink]="['/collections', category.slug]"
         class="group relative overflow-hidden rounded-xl aspect-square">
        <img 
          [src]="category.image" 
          [alt]="category.name"
          class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <div class="absolute bottom-4 left-4 right-4">
          <h3 class="text-white font-semibold text-lg">{{ category.name }}</h3>
          <span class="text-yellow-300 text-sm">{{ category.count }} items</span>
        </div>
      </a>
    </div>
  </div>
</section>
