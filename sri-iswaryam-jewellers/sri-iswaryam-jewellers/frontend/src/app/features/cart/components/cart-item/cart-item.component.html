<div class="flex gap-4 items-center p-4 bg-white rounded-lg shadow-sm">
  <img [src]="item.image" [alt]="item.name" class="w-20 h-20 object-cover rounded-md">

  <div class="flex-1">
    <h3 class="font-medium text-gray-800">{{ item.name }}</h3>
    <p class="text-sm text-gray-500">₹{{ item.price | number }}</p>
    <div class="flex items-center gap-2 mt-2">
      <div class="flex items-center border border-gray-200 rounded">
        <button (click)="decrement()" class="px-3 py-1">-</button>
        <span class="px-4 py-1">{{ item.quantity }}</span>
        <button (click)="increment()" class="px-3 py-1">+</button>
      </div>
      <button (click)="onRemove()" class="text-sm text-red-600">Remove</button>
      <button (click)="onMoveToWishlist()" class="text-sm text-gray-600">Move to Wishlist</button>
    </div>
  </div>

  <div class="text-right">
    <div class="text-gray-600 text-sm">Total</div>
    <div class="font-semibold text-yellow-700">₹{{ (item.price * item.quantity) | number }}</div>
  </div>
</div>
