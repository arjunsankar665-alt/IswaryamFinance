<aside class="w-full lg:w-64 bg-white rounded-xl shadow-sm p-6">
  <div class="flex justify-between items-center mb-6">
    <h3 class="font-semibold text-lg">Filters</h3>
    <button class="text-sm text-yellow-600 hover:text-yellow-700">Clear All</button>
  </div>

  <!-- Category Filter -->
  <div class="mb-6">
    <h4 class="font-medium mb-3">Category</h4>
    <div class="space-y-2">
      <label *ngFor="let cat of categories" class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" [value]="cat.id" (change)="onFilterChange('category', cat.id)" 
               class="rounded border-gray-300 text-yellow-600 focus:ring-yellow-500">
        <span class="text-sm text-gray-700">{{ cat.name }}</span>
        <span class="text-xs text-gray-400 ml-auto">({{ cat.count }})</span>
      </label>
    </div>
  </div>

  <!-- Price Range -->
  <div class="mb-6">
    <h4 class="font-medium mb-3">Price Range</h4>
    <div class="flex gap-2">
      <input type="number" placeholder="Min" [(ngModel)]="priceMin"
             class="input-field text-sm py-1.5">
      <span class="text-gray-400">-</span>
      <input type="number" placeholder="Max" [(ngModel)]="priceMax"
             class="input-field text-sm py-1.5">
    </div>
    <button (click)="applyPriceFilter()" class="mt-2 w-full btn-primary py-1.5 text-sm">Apply</button>
  </div>

  <!-- Metal Type -->
  <div class="mb-6">
    <h4 class="font-medium mb-3">Metal Type</h4>
    <div class="space-y-2">
      <label *ngFor="let metal of metalTypes" class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" [value]="metal" (change)="onFilterChange('metal', metal)"
               class="rounded border-gray-300 text-yellow-600 focus:ring-yellow-500">
        <span class="text-sm text-gray-700">{{ metal }}</span>
      </label>
    </div>
  </div>

  <!-- Weight Range -->
  <div class="mb-6">
    <h4 class="font-medium mb-3">Weight (grams)</h4>
    <div class="space-y-2">
      <label *ngFor="let range of weightRanges" class="flex items-center gap-2 cursor-pointer">
        <input type="radio" name="weight" [value]="range.value" (change)="onFilterChange('weight', range.value)"
               class="border-gray-300 text-yellow-600 focus:ring-yellow-500">
        <span class="text-sm text-gray-700">{{ range.label }}</span>
      </label>
    </div>
  </div>

  <!-- Availability -->
  <div class="mb-6">
    <label class="flex items-center gap-2 cursor-pointer">
      <input type="checkbox" [(ngModel)]="inStockOnly" (change)="onFilterChange('inStock', inStockOnly)"
             class="rounded border-gray-300 text-yellow-600 focus:ring-yellow-500">
      <span class="text-sm text-gray-700">In Stock Only</span>
    </label>
  </div>
</aside>
