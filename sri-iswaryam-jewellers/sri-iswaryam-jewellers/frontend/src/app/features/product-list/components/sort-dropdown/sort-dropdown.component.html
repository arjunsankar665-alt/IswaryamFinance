<div class="relative">
  <button (click)="isOpen = !isOpen" 
          class="flex items-center gap-2 px-4 py-2 bg-white rounded-lg shadow-sm border border-gray-200 hover:border-yellow-500 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
    </svg>
    <span class="text-sm font-medium text-gray-700">{{ selectedOption.label }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <div *ngIf="isOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-100 z-50">
    <ul class="py-2">
      <li *ngFor="let option of sortOptions">
        <button (click)="selectOption(option)" 
                [class.bg-yellow-50]="option.value === selectedOption.value"
                [class.text-yellow-700]="option.value === selectedOption.value"
                class="w-full px-4 py-2 text-left text-sm hover:bg-yellow-50 transition">
          {{ option.label }}
        </button>
      </li>
    </ul>
  </div>
</div>
