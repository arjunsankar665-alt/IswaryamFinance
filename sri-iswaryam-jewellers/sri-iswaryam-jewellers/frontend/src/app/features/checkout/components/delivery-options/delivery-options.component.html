<div class="space-y-4">
  <h3 class="text-lg font-medium text-gray-800">Choose Delivery Option</h3>

  <div class="space-y-3">
    <div *ngFor="let option of deliveryOptions"
         (click)="selectOption(option.id)"
         [class.ring-2]="selectedOptionId === option.id"
         [class.ring-yellow-500]="selectedOptionId === option.id"
         class="p-4 bg-white rounded-lg border border-gray-200 cursor-pointer hover:border-yellow-500 transition">
      <div class="flex justify-between items-start">
        <div class="flex items-start gap-3">
          <div class="w-5 h-5 mt-0.5 rounded-full border-2 flex items-center justify-center flex-shrink-0"
               [class.border-yellow-500]="selectedOptionId === option.id"
               [class.border-gray-300]="selectedOptionId !== option.id">
            <div *ngIf="selectedOptionId === option.id" class="w-3 h-3 bg-yellow-500 rounded-full"></div>
          </div>
          <div>
            <div class="font-medium text-gray-800">{{ option.name }}</div>
            <p class="text-sm text-gray-500">{{ option.description }}</p>
            <p class="text-sm text-green-600 mt-1">
              <span *ngIf="option.estimatedDays === 0">Delivery by today</span>
              <span *ngIf="option.estimatedDays > 0">Estimated delivery: {{ getEstimatedDate(option.estimatedDays) }}</span>
            </p>
          </div>
        </div>
        <div class="text-right">
          <span *ngIf="option.price === 0" class="text-green-600 font-medium">FREE</span>
          <span *ngIf="option.price > 0" class="font-medium text-gray-800">₹{{ option.price }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
    <p class="text-sm text-yellow-800">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Free delivery on orders above ₹10,000
    </p>
  </div>
</div>
