<section class="py-8 bg-gray-50 min-h-screen">
  <div class="container mx-auto px-4">
    <!-- Loading State -->
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-yellow-500 border-t-transparent"></div>
    </div>

    <!-- Product Content -->
    <div *ngIf="!loading && product" class="space-y-8">
      <!-- Main Product Section -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Image Gallery -->
        <app-image-gallery 
          [images]="productImages"
          [isWishlisted]="isWishlisted"
          (wishlistToggle)="toggleWishlist()">
        </app-image-gallery>

        <!-- Product Info & Actions -->
        <div class="space-y-6">
          <app-product-info 
            [product]="product"
            (sizeSelected)="onSizeSelect($event)">
          </app-product-info>

          <app-add-to-cart-section
            [inStock]="product.inStock"
            [maxQuantity]="5"
            (addToCartEvent)="addToCart($event)"
            (buyNowEvent)="buyNow($event)">
          </app-add-to-cart-section>
        </div>
      </div>

      <!-- Specifications & Reviews -->
      <app-specifications-table
        [specifications]="specifications"
        [description]="product.description"
        [reviews]="reviews"
        [averageRating]="product.rating"
        [totalReviews]="product.reviewCount"
        [ratingDistribution]="ratingDistribution">
      </app-specifications-table>

      <!-- Related Products -->
      <div class="mt-12">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6">You May Also Like</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div *ngFor="let related of relatedProducts" 
               class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition group">
            <div class="aspect-square overflow-hidden">
              <img [src]="related.image" [alt]="related.name" 
                   class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>
            <div class="p-3">
              <h3 class="text-sm font-medium text-gray-800 line-clamp-2">{{ related.name }}</h3>
              <p class="text-yellow-700 font-semibold mt-1">₹{{ related.price | number }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Not Found State -->
    <div *ngIf="!loading && !product" class="text-center py-20">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mx-auto text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <h2 class="text-2xl font-semibold text-gray-700 mb-2">Product Not Found</h2>
      <p class="text-gray-500 mb-4">The product you're looking for doesn't exist or has been removed.</p>
      <a routerLink="/products" class="btn-primary inline-block px-6 py-2">Browse Products</a>
    </div>
  </div>
</section>
