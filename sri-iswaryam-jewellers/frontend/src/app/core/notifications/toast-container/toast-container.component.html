<!-- Toast container - fixed position top right -->
<div class="fixed top-4 right-4 z-50 space-y-3 max-w-sm w-full pointer-events-none">
  <div *ngFor="let toast of toasts"
       class="pointer-events-auto rounded-lg border-l-4 p-4 shadow-lg transition-all duration-300 ease-in-out transform animate-slide-in"
       [ngClass]="getColorClasses(toast.type)">
    <div class="flex items-start gap-3">
      <!-- Icon -->
      <svg class="h-5 w-5 flex-shrink-0 mt-0.5" [ngClass]="getIconColor(toast.type)" 
           fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="getIcon(toast.type)" />
      </svg>
      
      <!-- Content -->
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm">{{ toast.title }}</p>
        <p *ngIf="toast.message" class="text-sm mt-1 opacity-90">{{ toast.message }}</p>
      </div>
      
      <!-- Dismiss button -->
      <button *ngIf="toast.dismissible"
              (click)="dismiss(toast.id)"
              class="flex-shrink-0 p-1 rounded-full hover:bg-black/10 transition-colors duration-200">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
