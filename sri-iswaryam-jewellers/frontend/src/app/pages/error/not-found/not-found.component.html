<!-- 404 Not Found Page -->
<div class="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 flex items-center justify-center p-4">
  <div class="max-w-2xl w-full text-center">
    <!-- Animated 404 Illustration -->
    <div class="relative mb-8">
      <!-- Background decorative elements -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-64 h-64 bg-yellow-100 rounded-full opacity-50 animate-pulse"></div>
      </div>
      
      <!-- 404 Text -->
      <div class="relative">
        <h1 class="text-[150px] sm:text-[200px] font-bold text-yellow-600 leading-none tracking-tight">
          404
        </h1>
        <!-- Jewel Icon -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2">
          <svg class="w-20 h-20 text-yellow-500 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                  d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Message -->
    <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-3">
      Page Not Found
    </h2>
    <p class="text-gray-600 mb-8 max-w-md mx-auto">
      Oops! The jewel you're looking for seems to have slipped away. 
      Don't worry, we have plenty more treasures waiting for you.
    </p>

    <!-- Search Box -->
    <div class="max-w-md mx-auto mb-8">
      <form (ngSubmit)="onSearch()" class="flex gap-2">
        <div class="flex-1 relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" 
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" 
                 [(ngModel)]="searchQuery"
                 name="search"
                 placeholder="Search for jewellery..."
                 class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg 
                        focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-shadow">
        </div>
        <button type="submit"
                class="px-6 py-3 bg-yellow-600 text-white font-semibold rounded-lg
                       hover:bg-yellow-700 transition-colors">
          Search
        </button>
      </form>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-12">
      <button (click)="goBack()" 
              class="flex items-center gap-2 px-6 py-3 border border-gray-300 text-gray-700 
                     font-semibold rounded-lg hover:bg-gray-50 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Go Back
      </button>
      <button (click)="goHome()" 
              class="flex items-center gap-2 px-6 py-3 bg-gray-900 text-white 
                     font-semibold rounded-lg hover:bg-gray-800 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Go to Homepage
      </button>
    </div>

    <!-- Suggested Links -->
    <div class="border-t border-gray-200 pt-8">
      <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-4">
        Popular Categories
      </h3>
      <div class="flex flex-wrap justify-center gap-3">
        <button *ngFor="let link of suggestedLinks"
                (click)="navigateTo(link.url)"
                class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-200 
                       rounded-full text-sm text-gray-700 hover:border-yellow-500 
                       hover:text-yellow-600 transition-colors shadow-sm">
          <svg *ngIf="link.icon === 'sparkles'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
          </svg>
          <svg *ngIf="link.icon === 'gem'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
          </svg>
          <svg *ngIf="link.icon === 'star'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
          </svg>
          <svg *ngIf="link.icon === 'tag'" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                  d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          {{ link.label }}
        </button>
      </div>
    </div>
  </div>
</div>
