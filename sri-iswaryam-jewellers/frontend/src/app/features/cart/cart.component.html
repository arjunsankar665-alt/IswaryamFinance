<section class="py-8 bg-gray-50 min-h-screen">
	<div class="container mx-auto px-4">
		<h1 class="text-2xl font-semibold mb-6">Your Cart</h1>

		<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
			<div class="lg:col-span-2 space-y-4">
				<app-cart-item *ngFor="let it of items"
											 [item]="it"
											 (quantityChange)="onQuantityChange($event)"
											 (remove)="onRemove($event)"
											 (moveToWishlist)="onMoveToWishlist($event)">
				</app-cart-item>

				<div *ngIf="items.length === 0" class="text-center py-12">
					<p class="text-gray-600">Your cart is empty.</p>
					<a routerLink="/products" class="btn-primary mt-4 inline-block">Shop Products</a>
				</div>
			</div>

			<div class="lg:col-span-1">
				<app-price-summary [subtotal]="subtotal" [discounts]="discounts" [shipping]="shipping" [taxes]="taxes" (checkout)="onCheckout()"></app-price-summary>
			</div>
		</div>
	</div>
</section>
