<section class="py-12 bg-gradient-to-b from-[#fdf8f3] via-white to-[#f4ece0] min-h-screen">
	<div class="container mx-auto px-4">
		<div class="flex items-center justify-between mb-8">
			<div>
				<p class="text-xs uppercase tracking-widest text-amber-700/80 font-medium">Shopping bag</p>
				<h1 class="text-3xl font-bold text-[#4A2C2A]">Your Cart</h1>
			</div>
		</div>

		<ng-container *ngIf="(isAuthenticated$ | async); else guestState">
			<ng-container *ngIf="(cart$ | async) as cart">
				<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:items-start">
					<div class="lg:col-span-2 space-y-4">
						<ng-container *ngIf="cart.items.length > 0; else emptyCart">
							<app-cart-item
								*ngFor="let item of cart.items; trackBy: trackByProductId"
								[item]="item"
								[disabled]="isBusy"
								(quantityChange)="onQuantityChange($event)"
								(remove)="onRemove($event)"
								(moveToWishlist)="onMoveToWishlist($event)"
							></app-cart-item>
						</ng-container>
						<ng-template #emptyCart>
							<div class="max-w-3xl mx-auto bg-white/90 backdrop-blur rounded-3xl border border-amber-100/70 shadow-xl p-12 text-center flex flex-col items-center gap-5">
								<div class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-200 to-amber-100 text-amber-800 flex items-center justify-center text-2xl shadow-inner">🛍️</div>
								<div class="space-y-2">
									<p class="text-2xl font-semibold text-gray-900">Your cart is empty</p>
									<p class="text-gray-600">Curate your favourites and check out when you are ready.</p>
								</div>
								<div class="flex flex-wrap justify-center gap-3">
									<a routerLink="/products" class="inline-flex items-center px-5 py-2.5 rounded-full bg-amber-700 text-white text-sm font-semibold shadow-md hover:bg-amber-600 transition">
										Shop all products
									</a>
									<a routerLink="/collections" class="inline-flex items-center px-5 py-2.5 rounded-full border border-amber-200 text-amber-700 text-sm font-semibold hover:bg-amber-50 transition">
										Explore collections
									</a>
								</div>
							</div>
						</ng-template>
					</div>

					<div class="lg:col-span-1" *ngIf="cart as currentCart">
						<ng-container *ngIf="summary(currentCart) as totals">
							<app-price-summary
								[subtotal]="totals.subtotal"
								[discounts]="totals.discounts"
								[shipping]="totals.shipping"
								[taxes]="totals.taxes"
								(checkout)="onCheckout()"
							></app-price-summary>
						</ng-container>
					</div>
				</div>
			</ng-container>
		</ng-container>

		<ng-template #guestState>
			<div class="bg-white/90 backdrop-blur rounded-3xl shadow-xl border border-amber-100/80 p-10 text-center">
				<p class="text-xl font-semibold text-gray-900 mb-2">Sign in to access your cart</p>
				<p class="text-gray-500 mb-6">Please login to view and manage items saved for you.</p>
				<button class="px-6 py-2.5 rounded-full bg-amber-700 hover:bg-amber-600 text-white font-semibold shadow-md" (click)="promptLogin()">
					Sign in to continue
				</button>
			</div>
		</ng-template>
	</div>
</section>
