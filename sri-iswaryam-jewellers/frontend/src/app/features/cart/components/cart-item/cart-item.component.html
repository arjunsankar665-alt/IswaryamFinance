<div class="flex gap-4 items-center p-4 bg-white rounded-lg shadow-sm border border-gray-100">
  <img [src]="item.image || 'assets/images/placeholders/product.jpg'" [alt]="item.name" class="w-20 h-20 object-cover rounded-md">

  <div class="flex-1">
    <h3 class="font-medium text-gray-800">{{ item.name }}</h3>
    <p class="text-sm text-gray-500">
      {{ item.price | currency: 'INR':'symbol':'1.0-0' }}
      <span *ngIf="item.inStock === false" class="ml-2 text-xs text-red-500 uppercase tracking-wide">Out of stock</span>
    </p>
    <div class="flex items-center gap-2 mt-2">
      <div class="flex items-center border border-gray-200 rounded">
        <button type="button" (click)="decrement()" class="px-3 py-1" [disabled]="disabled">-</button>
        <span class="px-4 py-1">{{ item.quantity }}</span>
        <button type="button" (click)="increment()" class="px-3 py-1" [disabled]="disabled">+</button>
      </div>
      <button type="button" (click)="onRemove()" class="text-sm text-red-600" [disabled]="disabled">Remove</button>
      <button type="button" (click)="onMoveToWishlist()" class="text-sm text-gray-600" [disabled]="disabled">Move to Wishlist</button>
    </div>
  </div>

  <div class="text-right">
    <div class="text-gray-600 text-sm">Total</div>
    <div class="font-semibold text-yellow-700">{{ (item.price * item.quantity) | currency: 'INR':'symbol':'1.0-0' }}</div>
  </div>
</div>
