<div class="bg-white rounded-lg shadow-sm p-4">
  <h3 class="font-medium text-gray-800 mb-3">Price Summary</h3>
  <div class="flex justify-between text-sm text-gray-600 mb-1">
    <span>Subtotal</span>
    <span>₹{{ subtotal | number }}</span>
  </div>
  <div class="flex justify-between text-sm text-gray-600 mb-1">
    <span>Discounts</span>
    <span>-₹{{ discounts | number }}</span>
  </div>
  <div class="flex justify-between text-sm text-gray-600 mb-1">
    <span>Shipping</span>
    <span>₹{{ shipping | number }}</span>
  </div>
  <div class="flex justify-between text-sm text-gray-600 mb-3">
    <span>Taxes</span>
    <span>₹{{ taxes | number }}</span>
  </div>
  <div class="flex justify-between font-semibold text-lg text-yellow-700 mb-3">
    <span>Total</span>
    <span>₹{{ total | number }}</span>
  </div>
  <button (click)="onCheckout()" class="w-full btn-primary py-2">Proceed to Checkout</button>
</div>
