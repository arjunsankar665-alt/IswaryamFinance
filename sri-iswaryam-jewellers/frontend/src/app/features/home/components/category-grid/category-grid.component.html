<section class="py-16 bg-white">
  <div class="container mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-serif font-bold text-center mb-4">
      Shop by Category
    </h2>
    <p class="text-gray-600 text-center mb-12 max-w-2xl mx-auto">
      Explore our curated collections of fine jewellery
    </p>
    
    <!-- Category Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <a *ngFor="let category of categories; trackBy: trackBySlug"
         [routerLink]="['/products', category.slug]"
         class="category-card group">
        <div class="category-card__media" [ngStyle]="{ 'background-image': 'url(' + activeImage(category) + ')' }"></div>
        <div class="category-card__veil"></div>
        <div class="category-card__content">
          <p class="text-xs uppercase tracking-[0.3em] text-white/80">{{ category.tagline }}</p>
          <h3 class="text-2xl font-serif text-white mt-3 mb-1">{{ category.name }}</h3>
          <div class="flex items-center gap-2 text-sm">
            <span class="text-white font-medium">{{ category.count }} styles</span>
            <span class="text-white/60">•</span>
            <span class="text-white/80">Tap to explore</span>
          </div>
        </div>
        <div class="category-card__accent bg-gradient-to-br mix-blend-screen" [ngClass]="category.accent"></div>
      </a>
    </div>
  </div>
</section>
