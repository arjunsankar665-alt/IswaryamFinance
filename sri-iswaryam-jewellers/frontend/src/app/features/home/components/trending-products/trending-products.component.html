<section class="py-16 bg-amber-50">
  <div class="container mx-auto px-4">
    <div class="flex flex-col md:flex-row justify-between items-center mb-12">
      <div>
        <h2 class="text-3xl md:text-4xl font-serif font-bold mb-2">
          Trending Now
        </h2>
        <p class="text-gray-600">Discover what's popular this season</p>
      </div>
      <a routerLink="/products" class="mt-4 md:mt-0 text-yellow-700 hover:text-yellow-800 font-semibold flex items-center gap-2">
        View All
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
        </svg>
      </a>
    </div>
    
    <!-- Products Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let product of trendingProducts" class="card-product group">
        <div class="relative overflow-hidden rounded-lg mb-4">
          <img 
            [src]="product.image" 
            [alt]="product.name"
            class="w-full aspect-square object-cover group-hover:scale-105 transition-transform duration-300"
          />
          <button class="absolute top-3 right-3 p-2 bg-white rounded-full shadow hover:bg-red-50 transition-colors">
            <svg class="w-5 h-5 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
            </svg>
          </button>
        </div>
        <h3 class="font-semibold text-gray-900 mb-1 line-clamp-2">{{ product.name }}</h3>
        <p class="text-sm text-gray-500 mb-2">{{ product.category }}</p>
        <div class="flex items-center gap-2">
          <span class="text-lg font-bold text-yellow-700">₹{{ product.price | number }}</span>
          <span *ngIf="product.originalPrice" class="text-sm text-gray-400 line-through">
            ₹{{ product.originalPrice | number }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
