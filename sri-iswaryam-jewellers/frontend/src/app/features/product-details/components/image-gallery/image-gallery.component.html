<div class="flex flex-col lg:flex-row gap-4">
  <!-- Thumbnails -->
  <div class="flex lg:flex-col gap-2 order-2 lg:order-1">
    <button *ngFor="let img of images; let i = index"
            (click)="selectImage(i)"
            [class.ring-2]="selectedIndex === i"
            [class.ring-yellow-500]="selectedIndex === i"
            class="w-16 h-16 md:w-20 md:h-20 rounded-lg overflow-hidden flex-shrink-0 border border-gray-200 hover:border-yellow-500 transition">
      <img [src]="img.thumbnail" [alt]="'Thumbnail ' + (i + 1)" class="w-full h-full object-cover">
    </button>
  </div>

  <!-- Main Image -->
  <div class="flex-1 order-1 lg:order-2 relative">
    <div class="relative aspect-square bg-gray-100 rounded-xl overflow-hidden cursor-zoom-in"
         (click)="toggleZoom()"
         (mousemove)="onMouseMove($event)"
         (mouseleave)="onMouseLeave()">
  <img [src]="images[selectedIndex].full" 
       [alt]="images[selectedIndex].alt"
       [style.transform]="isZoomed ? 'scale(2)' : 'scale(1)'"
       [style.transform-origin]="zoomOrigin"
       class="w-full h-full object-cover transition-transform duration-200">

      
      <!-- Zoom Icon -->
      <div *ngIf="!isZoomed" class="absolute bottom-4 right-4 bg-white/80 p-2 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
        </svg>
      </div>
    </div>

    <!-- Navigation Arrows -->
    <button (click)="prevImage()" 
            *ngIf="images.length > 1"
            class="absolute left-2 top-1/2 -translate-y-1/2 p-2 bg-white/80 rounded-full shadow-md hover:bg-white transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <button (click)="nextImage()" 
            *ngIf="images.length > 1"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-white/80 rounded-full shadow-md hover:bg-white transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>

    <!-- Wishlist Button -->
    <button (click)="toggleWishlist()"
            class="absolute top-4 right-4 p-3 bg-white rounded-full shadow-md hover:shadow-lg transition"
            [class.text-red-500]="isWishlisted">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" [attr.fill]="isWishlisted ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
      </svg>
    </button>
  </div>
</div>
