<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
  <article *ngFor="let product of products" 
           class="group bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition-all duration-300">
    <!-- Product Image -->
    <div class="relative aspect-square overflow-hidden">
      <a [routerLink]="['/product', product.slug || product.id]"
         class="block h-full">
        <img [src]="product.image" [alt]="product.name" 
             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        
        <!-- Badges -->
        <div class="absolute top-2 left-2 flex flex-col gap-1">
          <span *ngIf="product.isNew" class="bg-green-500 text-white text-xs px-2 py-0.5 rounded">New</span>
        </div>

        <!-- Out of Stock Overlay -->
        <div *ngIf="!product.inStock" class="absolute inset-0 bg-black/50 flex items-center justify-center">
          <span class="text-white font-semibold">Out of Stock</span>
        </div>
      </a>

      <!-- Quick Actions -->
      <div class="absolute top-2 right-2 flex flex-col gap-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
        <button (click)="addToWishlist(product)" 
                class="p-2 bg-white rounded-full shadow-md hover:bg-yellow-50 transition pointer-events-auto"
                [class.text-red-500]="product.isWishlisted">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [attr.fill]="product.isWishlisted ? 'currentColor' : 'none'" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>
        <button (click)="quickView(product)" 
                class="p-2 bg-white rounded-full shadow-md hover:bg-yellow-50 transition pointer-events-auto">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Product Info -->
    <div class="p-4">
      <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">{{ product.category }}</p>
      <h3 class="font-medium text-gray-800 line-clamp-2 mb-2 min-h-[2.5rem]">
        <a [routerLink]="['/product', product.slug || product.id]" class="hover:text-yellow-600 transition">
          {{ product.name }}
        </a>
      </h3>

      <!-- Rating -->
      <div class="flex items-center gap-1 mb-2">
        <div class="flex">
          <svg *ngFor="let star of [1,2,3,4,5]" xmlns="http://www.w3.org/2000/svg" 
               class="h-4 w-4" [class.text-yellow-400]="star <= (product.rating || 0)" 
               [class.text-gray-300]="star > (product.rating || 0)" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
        </div>
        <span class="text-xs text-gray-500">({{ product.reviews || 0 }})</span>
      </div>

      <!-- Price -->
      <div class="flex items-center gap-2">
        <span class="text-lg font-bold text-yellow-700">₹{{ product.price | number }}</span>
        <span *ngIf="product.originalPrice" class="text-sm text-gray-400 line-through">
          ₹{{ product.originalPrice | number }}
        </span>
      </div>

      <!-- Weight -->
      <p class="text-xs text-gray-500 mt-1">{{ product.weight }}g | {{ product.purity }}</p>
    </div>

    <!-- Add to Cart -->
    <div class="px-4 pb-4">
      <button (click)="addToCart(product)" 
              [disabled]="!product.inStock"
              class="w-full btn-primary py-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
        Add to Cart
      </button>
    </div>
  </article>
</div>

<!-- Empty State -->
<div *ngIf="products.length === 0" class="text-center py-16">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
  </svg>
  <h3 class="text-lg font-medium text-gray-700 mb-2">No products found</h3>
  <p class="text-gray-500">Try adjusting your filters or search terms</p>
</div>
