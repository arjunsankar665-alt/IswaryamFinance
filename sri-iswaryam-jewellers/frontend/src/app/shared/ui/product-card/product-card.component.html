<div class="group bg-white/95 backdrop-blur rounded-2xl shadow-lg hover:shadow-2xl border border-amber-50 hover:border-amber-100 transition-all duration-300 overflow-hidden"
     (mouseenter)="isHovered = true"
     (mouseleave)="isHovered = false">
  <!-- Image Container -->
  <a [routerLink]="['/products', product.slug]" class="block relative overflow-hidden aspect-square">
    <!-- Product Image -->
    <img [src]="product.image" 
         [alt]="product.name"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
         loading="lazy">
    
    <!-- Badges -->
    <div class="absolute top-3 left-3 flex flex-col gap-2">
      <span *ngIf="product.discount" 
            class="bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">
        -{{ product.discount }}%
      </span>
      <span *ngIf="product.isNew" 
            class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded">
        NEW
      </span>
      <span *ngIf="product.isBestseller" 
            class="bg-yellow-500 text-white text-xs font-bold px-2 py-1 rounded">
        BESTSELLER
      </span>
    </div>

    <!-- Wishlist Button -->
    <button (click)="onToggleWishlist($event)"
            class="absolute top-3 right-3 w-9 h-9 bg-white rounded-full shadow-md flex items-center justify-center transition-all duration-200 hover:scale-110"
            [class.text-red-500]="isWishlisted"
            [class.text-gray-400]="!isWishlisted">
      <svg class="w-5 h-5" [attr.fill]="isWishlisted ? 'currentColor' : 'none'" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
    </button>

    <!-- Quick Actions (Show on Hover) -->
    <div class="absolute inset-x-0 bottom-0 p-3 bg-gradient-to-t from-black/60 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-300">
      <div class="flex gap-2">
        <button (click)="onAddToCart($event)"
                class="flex-1 bg-amber-700 hover:bg-amber-600 text-white text-sm font-semibold py-2 rounded-lg transition-colors shadow-sm">
          Add to Cart
        </button>
        <button *ngIf="showQuickView"
                (click)="onQuickView($event)"
                class="w-10 bg-white/95 hover:bg-amber-50 text-[#4A2C2A] rounded-lg flex items-center justify-center transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Out of Stock Overlay -->
    <div *ngIf="!product.inStock" 
         class="absolute inset-0 bg-black/50 flex items-center justify-center">
      <span class="bg-white text-gray-800 font-semibold px-4 py-2 rounded-lg">Out of Stock</span>
    </div>
  </a>

  <!-- Product Info -->
  <div class="p-4">
    <!-- Category -->
    <p class="text-xs text-amber-700 font-semibold uppercase tracking-widest mb-1">
      {{ product.category }}
    </p>

    <!-- Name -->
    <a [routerLink]="['/products', product.slug]" 
       class="block font-semibold text-[#4A2C2A] hover:text-amber-700 transition-colors line-clamp-2 min-h-[2.5rem]">
      {{ product.name }}
    </a>

    <!-- Rating -->
    <div class="flex items-center gap-1 mt-2">
      <div class="flex">
        <svg *ngFor="let star of [1,2,3,4,5]" 
             class="w-4 h-4"
             [class.text-amber-500]="star <= product.rating"
             [class.text-amber-200]="star > product.rating"
             fill="currentColor" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
      </div>
      <span class="text-xs text-gray-500">({{ product.reviewCount }})</span>
    </div>

    <!-- Price -->
    <div class="mt-3 flex items-baseline gap-2">
      <span class="text-lg font-bold text-[#4A2C2A]">{{ formatPrice(product.price) }}</span>
      <span *ngIf="product.originalPrice" class="text-sm text-amber-700/60 line-through">
        {{ formatPrice(product.originalPrice) }}
      </span>
    </div>
  </div>
</div>
