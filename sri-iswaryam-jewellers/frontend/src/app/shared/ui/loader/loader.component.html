<!-- Full Screen Loader -->
<div *ngIf="fullScreen" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center">
  <div class="w-16 h-16 border-4 border-gray-200 border-t-yellow-600 rounded-full animate-spin"></div>
  <p *ngIf="message" class="mt-4 text-gray-600 font-medium">{{ message }}</p>
</div>

<!-- Inline Loader -->
<div *ngIf="!fullScreen" class="flex flex-col items-center justify-center p-4">
  <div class="border-4 border-gray-200 rounded-full animate-spin"
       [ngClass]="[sizeClasses, colorClasses]"
       style="border-top-color: currentColor;">
  </div>
  <p *ngIf="message" class="mt-2 text-sm text-gray-500">{{ message }}</p>
</div>
