<div class="mb-8" 
     [class.text-left]="align === 'left'"
     [class.text-center]="align === 'center'"
     [class.text-right]="align === 'right'">
  <div class="flex items-center justify-between flex-wrap gap-4"
       [class.justify-start]="align === 'left'"
       [class.justify-center]="align === 'center' && !viewAllLink"
       [class.justify-end]="align === 'right'">
    <div>
      <!-- Title with decorative element -->
      <div class="flex items-center gap-3" 
           [class.justify-center]="align === 'center'"
           [class.justify-end]="align === 'right'">
        <div class="hidden sm:block w-12 h-0.5 bg-gradient-to-r from-transparent to-yellow-600"></div>
        <h2 class="text-2xl md:text-3xl font-serif font-bold text-gray-800">
          {{ title }}
        </h2>
        <div class="hidden sm:block w-12 h-0.5 bg-gradient-to-l from-transparent to-yellow-600"></div>
      </div>
      
      <!-- Subtitle -->
      <p *ngIf="subtitle" class="text-gray-500 mt-2 max-w-2xl"
         [class.mx-auto]="align === 'center'">
        {{ subtitle }}
      </p>
    </div>
    
    <!-- View All Link -->
    <a *ngIf="viewAllLink" 
       [routerLink]="viewAllLink"
       class="text-yellow-600 hover:text-yellow-700 font-medium flex items-center gap-1 group transition-colors">
      {{ viewAllText }}
      <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</div>
