<!-- Address Form -->
<form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Full Name & Phone Row -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Full Name -->
    <div>
      <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">
        Full Name <span class="text-red-500">*</span>
      </label>
      <input type="text" id="fullName" formControlName="fullName"
             class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
             [class.border-red-500]="isInvalid('fullName')"
             placeholder="Enter full name">
      <p *ngIf="isInvalid('fullName')" class="mt-1 text-xs text-red-500">{{ getError('fullName') }}</p>
    </div>

    <!-- Phone -->
    <div>
      <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
        Mobile Number <span class="text-red-500">*</span>
      </label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">+91</span>
        <input type="tel" id="phone" formControlName="phone"
               class="w-full pl-12 pr-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
               [class.border-red-500]="isInvalid('phone')"
               placeholder="10-digit mobile number">
      </div>
      <p *ngIf="isInvalid('phone')" class="mt-1 text-xs text-red-500">{{ getError('phone') }}</p>
    </div>
  </div>

  <!-- Alternate Phone -->
  <div>
    <label for="alternatePhone" class="block text-sm font-medium text-gray-700 mb-1">
      Alternate Phone (Optional)
    </label>
    <div class="relative max-w-md">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500">+91</span>
      <input type="tel" id="alternatePhone" formControlName="alternatePhone"
             class="w-full pl-12 pr-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
             [class.border-red-500]="isInvalid('alternatePhone')"
             placeholder="10-digit mobile number">
    </div>
    <p *ngIf="isInvalid('alternatePhone')" class="mt-1 text-xs text-red-500">{{ getError('alternatePhone') }}</p>
  </div>

  <!-- Address Line 1 -->
  <div>
    <label for="addressLine1" class="block text-sm font-medium text-gray-700 mb-1">
      Address (House No, Building, Street) <span class="text-red-500">*</span>
    </label>
    <textarea id="addressLine1" formControlName="addressLine1" rows="2"
              class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors resize-none"
              [class.border-red-500]="isInvalid('addressLine1')"
              placeholder="Enter your complete address"></textarea>
    <p *ngIf="isInvalid('addressLine1')" class="mt-1 text-xs text-red-500">{{ getError('addressLine1') }}</p>
  </div>

  <!-- Address Line 2 -->
  <div>
    <label for="addressLine2" class="block text-sm font-medium text-gray-700 mb-1">
      Area / Locality (Optional)
    </label>
    <input type="text" id="addressLine2" formControlName="addressLine2"
           class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
           placeholder="Enter area or locality">
  </div>

  <!-- Landmark -->
  <div>
    <label for="landmark" class="block text-sm font-medium text-gray-700 mb-1">
      Landmark (Optional)
    </label>
    <input type="text" id="landmark" formControlName="landmark"
           class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
           placeholder="Near temple, school, etc.">
  </div>

  <!-- City, State, Pincode Row -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- City -->
    <div>
      <label for="city" class="block text-sm font-medium text-gray-700 mb-1">
        City <span class="text-red-500">*</span>
      </label>
      <input type="text" id="city" formControlName="city"
             class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
             [class.border-red-500]="isInvalid('city')"
             placeholder="Enter city">
      <p *ngIf="isInvalid('city')" class="mt-1 text-xs text-red-500">{{ getError('city') }}</p>
    </div>

    <!-- State -->
    <div>
      <label for="state" class="block text-sm font-medium text-gray-700 mb-1">
        State <span class="text-red-500">*</span>
      </label>
      <select id="state" formControlName="state"
              class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors bg-white"
              [class.border-red-500]="isInvalid('state')">
        <option value="">Select State</option>
        <option *ngFor="let state of states" [value]="state">{{ state }}</option>
      </select>
      <p *ngIf="isInvalid('state')" class="mt-1 text-xs text-red-500">{{ getError('state') }}</p>
    </div>

    <!-- Pincode -->
    <div>
      <label for="pincode" class="block text-sm font-medium text-gray-700 mb-1">
        Pincode <span class="text-red-500">*</span>
      </label>
      <input type="text" id="pincode" formControlName="pincode" maxlength="6"
             class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-colors"
             [class.border-red-500]="isInvalid('pincode')"
             placeholder="6-digit pincode">
      <p *ngIf="isInvalid('pincode')" class="mt-1 text-xs text-red-500">{{ getError('pincode') }}</p>
    </div>
  </div>

  <!-- Address Type -->
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">
      Address Type <span class="text-red-500">*</span>
    </label>
    <div class="flex flex-wrap gap-3">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" formControlName="addressType" value="home"
               class="w-4 h-4 text-yellow-600 focus:ring-yellow-500">
        <span class="flex items-center gap-1 text-sm text-gray-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Home
        </span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" formControlName="addressType" value="work"
               class="w-4 h-4 text-yellow-600 focus:ring-yellow-500">
        <span class="flex items-center gap-1 text-sm text-gray-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          Work
        </span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="radio" formControlName="addressType" value="other"
               class="w-4 h-4 text-yellow-600 focus:ring-yellow-500">
        <span class="flex items-center gap-1 text-sm text-gray-700">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Other
        </span>
      </label>
    </div>
  </div>

  <!-- Default Address Checkbox -->
  <div class="flex items-center gap-2">
    <input type="checkbox" id="isDefault" formControlName="isDefault"
           class="w-4 h-4 text-yellow-600 focus:ring-yellow-500 rounded">
    <label for="isDefault" class="text-sm text-gray-700 cursor-pointer">
      Set as default address
    </label>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-col sm:flex-row gap-3 pt-4">
    <button type="submit"
            [disabled]="isSubmitting"
            class="flex-1 px-6 py-3 bg-yellow-600 text-white font-semibold rounded-lg
                   hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2
                   disabled:opacity-50 disabled:cursor-not-allowed transition-colors
                   flex items-center justify-center gap-2">
      <svg *ngIf="isSubmitting" class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ isSubmitting ? 'Saving...' : submitButtonText }}</span>
    </button>
    <button type="button" (click)="onCancel()"
            class="flex-1 sm:flex-none px-6 py-3 border border-gray-300 text-gray-700 font-semibold rounded-lg
                   hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-200
                   transition-colors">
      Cancel
    </button>
  </div>
</form>
