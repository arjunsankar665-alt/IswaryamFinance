<!-- Main Header -->
<header class="bg-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16 md:h-20">
      <!-- Mobile Menu Button -->
      <button (click)="onMenuClick()" 
              class="lg:hidden p-2 -ml-2 text-gray-600 hover:text-yellow-600 transition-colors"
              aria-label="Open menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2">
        <div class="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-br from-yellow-500 to-yellow-700 rounded-full flex items-center justify-center">
          <span class="text-white font-bold text-lg md:text-xl">SI</span>
        </div>
        <div class="hidden sm:block">
          <h1 class="text-lg md:text-xl font-serif font-bold text-gray-800">Sri Iswaryam</h1>
          <p class="text-xs text-yellow-600 -mt-1">Premium Jewellers</p>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden lg:flex items-center gap-1">
        <a *ngFor="let link of navLinks"
           [routerLink]="link.path"
           routerLinkActive="text-yellow-600 bg-yellow-50"
           [routerLinkActiveOptions]="{ exact: link.path === '/' }"
           class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-yellow-600 hover:bg-yellow-50 rounded-lg transition-all">
          {{ link.label }}
        </a>
      </nav>

      <!-- Right Actions -->
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Search -->
        <button (click)="toggleSearch()" 
                class="p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
                aria-label="Search">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>

        <!-- Account -->
        <ng-container *ngIf="(isAuthenticated$ | async); else guestMenu">
          <div class="relative">
            <button (click)="onAccountButtonClick()"
                    class="p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
                    aria-label="Account menu">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </button>
            <app-account-dropdown
              class="hidden sm:block"
              *ngIf="showAccountDropdown"
              [open]="showAccountDropdown"
              [user]="(user$ | async) || null"
              [items]="accountItems"
              (select)="onAccountSelect($event)">
            </app-account-dropdown>
          </div>
        </ng-container>
        <ng-template #guestMenu>
          <button (click)="openAuthModal()"
                  class="p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
                  aria-label="Login or signup">
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
          </button>
        </ng-template>

        <!-- Wishlist -->
          <ng-container *ngIf="(isAuthenticated$ | async); else wishlistGuest">
            <a routerLink="/wishlist" 
               class="relative p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
               aria-label="Wishlist">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span *ngIf="wishlistCount > 0" 
                class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">
            {{ wishlistCount }}
          </span>
            </a>
          </ng-container>
          <ng-template #wishlistGuest>
            <button (click)="openAuthModal()"
                    class="relative p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
                    aria-label="Login to view wishlist">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
              </svg>
            </button>
          </ng-template>

          <!-- Cart -->
          <ng-container *ngIf="(isAuthenticated$ | async); else cartGuest">
            <a routerLink="/cart" 
               class="relative p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
               aria-label="Cart">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          <span *ngIf="cartCount > 0" 
                class="absolute -top-1 -right-1 w-5 h-5 bg-yellow-600 text-white text-xs rounded-full flex items-center justify-center">
            {{ cartCount }}
          </span>
            </a>
          </ng-container>
          <ng-template #cartGuest>
            <button (click)="openAuthModal()"
                    class="relative p-2 text-gray-600 hover:text-yellow-600 hover:bg-yellow-50 rounded-full transition-all"
                    aria-label="Login to view cart">
              <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
              </svg>
            </button>
          </ng-template>
      </div>
    </div>
  </div>

  <!-- Search Bar (Expandable) -->
  <div *ngIf="isSearchOpen" 
       class="border-t bg-gray-50 py-3 animate-slide-up">
    <div class="container mx-auto px-4">
      <div class="relative max-w-2xl mx-auto">
        <input type="text" 
               placeholder="Search for gold necklaces, diamond rings, bangles..." 
               class="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-full focus:ring-2 focus:ring-yellow-500 focus:border-transparent outline-none"
               autofocus>
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button (click)="toggleSearch()" 
                class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <app-auth-modal
    [open]="showAuthModal"
    (closed)="closeAuthModal()"
    (authenticated)="closeAuthModal()">
  </app-auth-modal>
</header>
