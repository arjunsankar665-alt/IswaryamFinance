<div class="account-dropdown" *ngIf="open" @fadeSlideIn>
  <div class="account-dropdown__panel">
    <!-- User Profile Section -->
    <div class="account-dropdown__header">
      <div class="account-dropdown__avatar">
        {{ user?.name?.charAt(0) || user?.email?.charAt(0) || 'G' }}
      </div>
      <div class="account-dropdown__user-info">
        <h3 class="account-dropdown__name">{{ user?.name || 'Guest User' }}</h3>
        <p class="account-dropdown__email">{{ user?.email || 'welcome@sriswaryam.com' }}</p>
      </div>
      <span class="account-dropdown__badge">
        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
        </svg>
      </span>
    </div>

    <!-- Menu Items -->
    <nav class="account-dropdown__menu">
      <button *ngFor="let item of items; trackBy: trackByLabel"
              type="button"
              class="account-dropdown__item"
              (click)="onSelect(item)">
        <span class="account-dropdown__item-icon">{{ item.icon }}</span>
        <div class="account-dropdown__item-content">
          <span class="account-dropdown__item-label">{{ item.label }}</span>
          <span *ngIf="item.description" class="account-dropdown__item-desc">{{ item.description }}</span>
        </div>
        <svg class="account-dropdown__item-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </nav>
  </div>
</div>
